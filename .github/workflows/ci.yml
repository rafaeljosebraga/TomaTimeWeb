name: CI - Testes e Validação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes Unitários e Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

      - name: Executar testes automatizados (Vitest)
        run: npm run test:run

      - name: Validar build de produção (Next.js)
        run: npm run build

